<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ástrid & Ibon - Ezkondu egingo gara! - ¡Nos casamos!</title>

<meta property="og:title" content="Ástrid & Ibon · Ezkondu egingo gara! · ¡Nos casamos! 💍">
<meta property="og:description" content="Gutun bat duzu! · ¡Tienes correo! 💌">
<meta property="og:image" content="https://lockodev.github.io/boda-astrid-ibon/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="img/pp-rosa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf4ea; --ink:#2b2340; --terra:#e2725b; --sage:#6f9a73;
  --gold:#e9b44c; --pink:#e8458b;
  --serif:'Playfair Display',Georgia,serif; --hand:'Caveat','Comic Sans MS',cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;touch-action:pan-x pan-y;
  transition:background 1.2s ease,color 1.2s ease;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden;height:100vh}
body.party{background:#140f24;color:#fff}
main{overflow-x:clip}
section{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:70px 22px;text-align:center;position:relative}
h2{font-family:var(--serif);font-size:clamp(2rem,9vw,3.2rem);margin:.2em 0;line-height:1.1}
.kicker{text-transform:uppercase;letter-spacing:.2em;font-size:.75rem;font-weight:900;color:var(--terra)}
.hand{font-family:var(--hand);font-size:1.6rem}
.sub{margin:.2em 0 0;opacity:.75}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:none;cursor:pointer;text-decoration:none;
  background:var(--ink);color:#fff;font:700 1rem 'Nunito',sans-serif;padding:.85em 1.4em;border-radius:999px;
  box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.terra{background:var(--terra)} .btn.sage{background:var(--sage)} .btn.light{background:#fff;color:var(--ink)}
.btn.small{font-size:.85rem;padding:.6em 1.1em}
[hidden]{display:none!important}

[data-reveal]{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,1.2,.4,1)}
[data-reveal].in{opacity:1;transform:none}

#progress{position:fixed;top:0;left:0;height:5px;width:0;z-index:60;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:0 4px 4px 0}
#progress::after{content:'💍';position:absolute;right:-12px;top:-7px;font-size:16px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.floaty{position:fixed;pointer-events:none;z-index:80;font-size:26px;animation:floatUp 1.4s ease-out forwards}
@keyframes floatUp{to{transform:translate(var(--dx),-140px) rotate(var(--rot)) scale(1.4);opacity:0}}
@keyframes popIn{from{transform:scale(0)}}

.flag{width:24px;height:16px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
#langBtn{position:fixed;top:14px;right:12px;z-index:70;display:none;align-items:center;gap:6px;background:rgba(255,255,255,.92);border:none;
  border-radius:999px;padding:6px 12px 6px 8px;font:900 .78rem 'Nunito',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;color:var(--ink)}
body.opened #langBtn{display:flex}

/* ===== SOBRE ===== */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:20px;
  background:radial-gradient(circle at 50% 40%,#fff8ee,#efd7bd);transition:opacity .9s,visibility .9s;text-align:center}
#intro.gone{opacity:0;visibility:hidden}
#intro .top{font-family:var(--hand);font-size:2rem;line-height:1.1;animation:wobble 2.5s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.envelope{position:relative;width:290px;height:185px;background:#e6c39d;border-radius:8px;box-shadow:0 25px 50px rgba(90,50,20,.25);perspective:900px}
.envelope .letter{position:absolute;left:14px;right:14px;bottom:10px;height:165px;background:#fffdf8;border-radius:6px;z-index:1;
  padding:18px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform 1s cubic-bezier(.3,1.3,.5,1) .55s;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.envelope .letter b{font-family:var(--serif);font-size:1.6rem}
.envelope .letter span{font-family:var(--hand);font-size:1.3rem;color:var(--terra)}
.envelope .pocket{position:absolute;inset:0;z-index:2;border-radius:8px;background:#ddb388;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.envelope .flap{position:absolute;top:0;left:0;right:0;height:118px;z-index:3;background:#d1a275;border-radius:8px 8px 0 0;
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease,z-index 0s .3s}
.envelope.open .flap{transform:rotateX(180deg);z-index:0}
.envelope.open .letter{transform:translateY(-130px) rotate(-2deg)}
.seal{position:absolute;left:50%;top:104px;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;z-index:4;cursor:pointer;border:none;
  background:radial-gradient(circle at 35% 30%,#f08a73,#b23e2a 70%);color:#ffe9dc;font:700 1.15rem var(--serif);
  box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 -4px 8px rgba(0,0,0,.25);animation:pulse 1.5s ease-in-out infinite}
.envelope.open .seal{animation:none;transform:scale(0) rotate(90deg);transition:transform .35s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.langs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;transition:opacity .4s}
.langs button{display:flex;align-items:center;gap:10px;background:#fff;border:none;border-radius:999px;padding:12px 20px;
  font:900 1rem 'Nunito',sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:pointer;color:var(--ink)}
.langs button:active{transform:translateY(3px)}
.langs .flag{width:30px;height:20px}
#intro .hint{font-size:.85rem;opacity:.65;margin-top:-14px}
#intro.opening .langs,#intro.opening .hint{opacity:0;pointer-events:none}

/* ===== HERO ===== */
#hero{overflow:hidden;padding-top:140px}
.garland{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;width:max-content;pointer-events:none}
.garland::before{content:'';position:absolute;top:3px;left:0;right:0;height:3px;background:#a0805f;border-radius:2px}
.garland span{display:block;margin:0 -1vw;transform:translateY(-110%);transition:transform 1s cubic-bezier(.3,1.5,.5,1)}
#hero.in .garland span{transform:none}
.garland span:nth-child(2){transition-delay:.1s}.garland span:nth-child(3){transition-delay:.2s}.garland span:nth-child(4){transition-delay:.3s}.garland span:nth-child(5){transition-delay:.4s}
.garland img{display:block;width:30vw;max-width:170px;transform-origin:50% 0;animation:flagSwing 3s ease-in-out infinite alternate;filter:drop-shadow(0 5px 4px rgba(0,0,0,.12))}
.garland span:nth-child(even) img{animation-delay:-1.5s}
@keyframes flagSwing{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
.petal{position:absolute;top:-40px;font-size:22px;animation:fall linear infinite;opacity:.8;pointer-events:none}
@keyframes fall{to{transform:translate(var(--sway),115vh) rotate(540deg)}}
.names{font-family:var(--serif);font-size:clamp(3.2rem,17vw,6.5rem);line-height:.95;margin:0;padding-top:.22em}
#hero .kicker{margin-bottom:14px}
.names .l{display:inline-block;opacity:0;transform:translateY(-90px) rotate(-25deg)}
#hero.in .names .l{animation:drop .8s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(var(--i)*70ms + .3s)}
@keyframes drop{to{opacity:1;transform:none}}
.amp{display:block;font-family:var(--hand);color:var(--pink);font-size:clamp(3rem,14vw,5rem);margin:.05em 0;opacity:0;transform:scale(0) rotate(-180deg)}
#hero.in .amp{animation:ampIn .9s cubic-bezier(.2,1.6,.4,1) .8s forwards}
@keyframes ampIn{to{opacity:1;transform:none}}
.stamp{display:inline-block;margin-top:44px;border:4px solid var(--terra);color:var(--terra);padding:.3em .7em;border-radius:8px;
  font:900 1.15rem 'Nunito',sans-serif;letter-spacing:.04em;text-transform:uppercase;opacity:0;transform:rotate(-7deg) scale(3)}
#hero.in .stamp{animation:stamp .35s ease-in 1.8s forwards}
@keyframes stamp{60%{opacity:1;transform:rotate(-7deg) scale(.9)}100%{opacity:1;transform:rotate(-7deg) scale(1)}}
.late{margin-top:28px;opacity:0;transition:opacity 1s 2.3s}
#hero.in .late{opacity:.9}
.scrollhint{position:absolute;bottom:24px;left:0;right:0;font-size:.85rem;opacity:0;transition:opacity 1s 2.6s}
#hero.in .scrollhint{opacity:.75}
.scrollhint i{display:block;font-style:normal;font-size:1.6rem;animation:bounce 1.2s infinite}
@keyframes bounce{50%{transform:translateY(8px)}}

/* ===== MAPA ===== */
.scene{display:block;padding:0;min-height:0}
#historia{height:680vh}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.captions{position:relative;width:100%;height:112px;flex:none}
.captions p{position:absolute;inset:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  font-family:var(--serif);font-size:clamp(1.3rem,6.2vw,2.1rem);line-height:1.2;opacity:0;transform:translateY(18px) scale(.96);transition:.45s}
.captions p.on{opacity:1;transform:none}
.captions p em{font-family:var(--hand);font-style:normal;color:var(--terra);font-size:1.3em}
.captions p small{font-family:'Nunito',sans-serif;font-size:.5em;opacity:.6}
#mapSvg{width:100%;max-height:52vh;overflow:visible;flex:none;margin-top:8px}
#mapSvg .lbl{font:900 10px 'Nunito',sans-serif;letter-spacing:.1em;fill:#2b2340;opacity:.75}
#mapSvg .sea-lbl{font:italic 700 12px 'Playfair Display',serif;fill:#2f6d8f;opacity:.6}
.wave{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;opacity:.55;stroke-dasharray:14 10;animation:waveMove 3s linear infinite}
@keyframes waveMove{to{stroke-dashoffset:-48}}
.cloud{animation:cloud 16s linear infinite}
@keyframes cloud{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
.bobbing{animation:bobY 2.4s ease-in-out infinite}
@keyframes bobY{50%{transform:translateY(-5px)}}
.trail{fill:none;stroke-width:3;stroke-linecap:round;opacity:0}
.trail.I{stroke:var(--sage)} .trail.A{stroke:var(--terra)}
.trail.drawing{opacity:1}
.trail.done{opacity:.4;stroke-dasharray:3 7!important;stroke-dashoffset:0!important}
.trail.final{stroke:var(--gold);stroke-width:4}
.trail.final.done{opacity:1;stroke-dasharray:none!important}
.pin .pin-in{transform:scale(0);transform-box:fill-box;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.2,1.8,.4,1)}
.showI #pinI .pin-in,.showA #pinA .pin-in{transform:scale(1)}
.pin{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.pin text.ini{font:700 22px 'Playfair Display',serif;fill:#fff}
.pin text.nm{font:700 16px 'Caveat',cursive;fill:#2b2340}
#miniHeart{transition:opacity .3s}
#loveHeart{transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.2,1.8,.4,1)}
.landed #loveHeart{transform:scale(1)}
#rain,#rainbow{transition:opacity .8s}
#rainbow,.landed #rain{opacity:0}
.landed #rainbow{opacity:1}
.stats{font-size:.82rem;font-weight:700;line-height:1.7;opacity:.9;margin-top:6px}
.stats b{font-family:var(--serif);font-size:1.05rem;color:var(--terra)}
.clocks{font-size:.78rem;opacity:.7;font-weight:400}
.pass{position:absolute;left:50%;bottom:3%;width:min(92%,350px);background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;text-align:left;
  box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translate(-50%,160%) rotate(6deg);transition:transform .7s cubic-bezier(.3,1.3,.5,1);z-index:5}
.pass-on .pass{transform:translate(-50%,0) rotate(-2deg)}
.pass-top{background:var(--ink);color:#fff;padding:10px 16px;font-weight:900;font-size:.74rem;letter-spacing:.1em;display:flex;justify-content:space-between;gap:8px}
.pass-top span{opacity:.6;font-weight:400;letter-spacing:0}
.pass-body{padding:12px 16px 14px;position:relative}
.pass small{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;opacity:.5;font-weight:900}
.pass .who{font:700 1.05rem var(--serif)}
.pass .route{display:flex;align-items:center;gap:10px;margin:6px 0}
.pass .route b{font:700 2rem var(--serif)}
.pass .route i{flex:1;border-top:2px dashed #bbb;position:relative}
.pass .route i::after{content:'✈️';position:absolute;left:50%;top:-15px;transform:translateX(-50%) rotate(45deg);font-style:normal}
.pass .row{display:flex;gap:16px;margin-top:8px;font-weight:700;font-size:.86rem}
.pass .row>div{flex:1}
.pass .barcode{height:28px;margin-top:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 7px,transparent 7px 9px,var(--ink) 9px 10px,transparent 10px 13px)}
.oneway{position:absolute;right:10px;top:66px;border:4px solid var(--pink);color:var(--pink);font:900 1.1rem 'Nunito',sans-serif;padding:.15em .5em;border-radius:8px;
  background:rgba(255,255,255,.88);transform:rotate(-12deg) scale(3);opacity:0;transition:transform .3s ease-in,opacity .2s;white-space:nowrap}
.stamped .oneway{transform:rotate(-12deg) scale(1);opacity:1}

/* ===== FOTOS: la mesa ===== */
#fotos{min-height:0;padding:80px 22px 28px}
#mesa{min-height:0;height:100vh;height:100svh;padding:0}
.table{position:relative;width:100%;height:100%;overflow:hidden;perspective:1000px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tphoto{position:absolute;box-sizing:border-box;padding:9px 9px 0;border-radius:3px;background:#fff;
  pointer-events:none;will-change:transform,opacity;opacity:0;backface-visibility:hidden}
.tphoto .im{width:100%;background:center/cover no-repeat}
.tphoto .cap{height:44px;display:flex;align-items:center;justify-content:center;gap:.35em;white-space:nowrap;overflow:hidden;
  font-family:var(--hand);font-size:1.4rem;color:var(--ink)}
.tphoto .cap small{font-size:.8em;color:var(--terra)}

/* ===== FECHA ===== */
.calendar{width:220px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.15);margin:20px auto 8px;
  transform-origin:top;transform:perspective(600px) rotateX(-95deg);opacity:0;transition:transform 1.1s cubic-bezier(.2,1.5,.4,1),opacity .4s}
.calendar.in{transform:perspective(600px) rotateX(0);opacity:1}
.calendar .m{background:var(--terra);color:#fff;font-weight:900;letter-spacing:.2em;text-transform:uppercase;padding:12px}
.calendar .d{position:relative;font:700 6rem/1 var(--serif);padding:14px 0 0;color:var(--ink)}
.calendar .d svg{position:absolute;left:50%;top:50%;width:170px;height:130px;transform:translate(-50%,-46%);overflow:visible}
.calendar .d path{fill:none;stroke:var(--pink);stroke-width:4;stroke-linecap:round;stroke-dasharray:520;stroke-dashoffset:520;transition:stroke-dashoffset 1.3s ease 1s}
.calendar.in .d path{stroke-dashoffset:0}
.calendar .w{padding:4px 0 16px;color:#777;text-transform:capitalize;font-weight:700}
.datelong{font-weight:700;font-size:1.05rem}
.countdown{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.countdown div{background:var(--ink);color:#fff;border-radius:14px;padding:10px 0;width:70px}
.countdown b{display:block;font:700 1.8rem var(--serif)}
.countdown small{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.7}

/* ===== PLAN ===== */
.timeline{position:relative;width:min(88vw,380px);margin:26px auto 10px;text-align:left}
.tl-line{position:absolute;left:31px;top:20px;bottom:20px;width:4px;background:#ead9c4;border-radius:2px;overflow:hidden}
.tl-line i{position:absolute;inset:0;background:linear-gradient(var(--terra),var(--pink));transform-origin:top;transform:scaleY(var(--lp,0))}
.tl-item{position:relative;display:flex;align-items:center;gap:16px;margin:0 0 22px}
.tl-icon{flex:none;width:66px;height:66px;border-radius:50%;background:#fff;border:3px solid var(--terra);display:flex;align-items:center;justify-content:center;
  font-size:1.9rem;z-index:1;box-shadow:0 6px 16px rgba(0,0,0,.1)}
.tl-item.in .tl-icon{animation:popIn .6s cubic-bezier(.3,1.7,.5,1)}
.tl-time{font:900 .85rem 'Nunito',sans-serif;color:var(--terra);letter-spacing:.08em}
.tl-txt b{display:block;font:700 1.25rem var(--serif);line-height:1.2}
.place{background:#fff;color:var(--ink);border-radius:26px;padding:26px 22px;width:min(90vw,380px);box-shadow:0 18px 40px rgba(0,0,0,.12);margin-top:10px}
.place .icon{font-size:3rem}
.place h3{font-family:var(--serif);font-size:1.6rem;margin:.2em 0 .1em}
.place p{margin:.3em 0;opacity:.8}
.place .joke{font-size:.85rem;margin-top:14px}

/* ===== MÚSICA ===== */
#musica{background:#140f24;color:#fff;overflow:hidden;padding-top:190px;padding-bottom:min(210px,18vh + 30px)}
#musica .kicker{color:#ff8be6}
.disco-cv{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#musica > *:not(.disco-cv){position:relative;z-index:1}
#musica h2,#musica > p{text-shadow:0 2px 10px #000,0 0 22px rgba(0,0,0,.8)}
#musica h2{text-shadow:0 0 6px #ff4fd8,0 0 22px rgba(255,79,216,.6),0 3px 12px #000}
.ballhint{position:absolute!important;top:182px;left:0;right:0;font-size:.78rem;opacity:.65;text-shadow:0 1px 6px #000}
#musica .kicker{margin-top:26px}
.spotify{width:min(92vw,420px);margin:18px auto 16px}
.spotify iframe{width:100%;height:352px;border:0;border-radius:14px}
.spotify .ph{border:2px dashed rgba(255,255,255,.3);border-radius:16px;padding:22px;font-size:.9rem;opacity:.8}
.or{margin:26px 0 10px;opacity:.85}
.form{display:flex;flex-direction:column;gap:10px;width:min(92vw,380px)}
.form input:not([type=radio]),.form textarea{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.25);border-radius:14px;
  padding:.85em 1em;color:inherit;font:1rem 'Nunito',sans-serif;outline:none;width:100%;resize:vertical}
.form input:focus,.form textarea:focus{border-color:#ff8be6}
.form ::placeholder{color:currentColor;opacity:.5}
.fieldrow{display:flex;gap:8px} .fieldrow input{flex:1;min-width:0}
.dice{flex:none;width:54px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);font-size:1.5rem;cursor:pointer}
.dice.roll{animation:spin .5s}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:2px 0}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:.45em .9em;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);font-size:.85rem;cursor:pointer;transition:.2s}
.chips input:checked+span{background:#ff8be6;border-color:#ff8be6;color:#140f24;font-weight:900}
.form .btn{align-self:center;margin-top:6px}
#songThanks{min-height:1.5em;margin-top:14px;color:#ffd36e}
.reqs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;max-width:380px}
.reqs span{background:rgba(255,255,255,.12);border-radius:999px;padding:.35em .9em;font-size:.85rem;animation:popIn .5s cubic-bezier(.3,1.7,.5,1)}

/* ===== RSVP ===== */
.rsvp-zone{position:relative;width:min(92vw,380px);height:200px;margin-top:6px}
.rsvp-zone .btn{position:absolute;font-size:1.2rem;padding:.9em 1.8em;transition:left .25s ease,top .25s ease,transform .15s}
#yes{left:12%;top:38%} #no{left:60%;top:38%;background:#aaa}
#noMsg{height:1.6em;font-family:var(--hand);font-size:1.5rem;color:var(--terra)}
#rsvpForm{color:var(--ink);background:#fff;border-radius:24px;padding:22px 18px;box-shadow:0 18px 40px rgba(0,0,0,.12);animation:popIn .5s cubic-bezier(.3,1.5,.5,1)}

.step output{min-width:22px;text-align:center;font:700 1.05rem var(--serif)}
.linklike{background:none;border:none;color:inherit;opacity:.6;font:.85rem 'Nunito',sans-serif;text-decoration:underline;cursor:pointer;align-self:center}

footer{padding:30px 20px 70px;text-align:center}

<!-- ============ SOBRE ============ -->
<div id="intro">

  <div class="envelope" id="envelope">

</section>
<section id="mesa"><div class="table" id="table"></div></section>

<!-- ============ FECHA ============ -->
<section id="fecha">

  <h2 data-reveal data-t="dTitle"></h2>

    <div class="m" id="calM"></div>

    <input name="artista" data-tp="mArtist">

    <button class="btn terra" type="submit" data-t="mSend"></button>
  </form>
  <div id="songThanks" class="hand"></div>
  <div id="myRequests" class="reqs"></div>
</section>

<!-- ============ CONFIRMACIÓN ============ -->
<section id="rsvp">

  <h2 data-reveal data-t="rTitle"></h2>
  <p data-reveal data-t="rDeadline"></p>

    <button class="btn" id="no" data-t="no"></button>
  </div>
  <div id="noMsg"></div>
  <form class="form" id="rsvpForm" autocomplete="off" hidden>

      <label><span data-t="fAdults"></span><div class="step" data-name="adultos"><button type="button" data-d="-1">−</button><output>1</output><button type="button" data-d="1">+</button></div></label>

    </div>
    <textarea name="intol" rows="2" class="onlyYes" data-tp="fIntol"></textarea>
    <textarea name="coment" rows="3" data-tp="fComment"></textarea>
    <button class="btn terra" type="submit" data-t="fSend"></button>
    <button class="linklike" type="button" id="changeAns" data-t="fChange"></button>
  </form>
  <div id="doneBox" hidden>

    <p id="doneText"></p>

  </div>
</section>

<footer>

  <p><span data-t="love"></span><br><b data-c="pareja"></b> 💛<br>Eskerrik asko!</p>
</footer>

  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}

// sonido de cámara de fotos: "clic" del obturador + "clac" del espejo, hecho con ruido filtrado
let noiseBuf;
function shutter() {
  if (!actx) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * .2), actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime;
  const hit = (when, dur, freq, q, vol) => {
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; s.playbackRate.value = .9 + Math.random() * .2;
    f.type = 'bandpass'; f.frequency.value = freq * (.92 + Math.random() * .16); f.Q.value = q;
    g.gain.setValueAtTime(vol, t + when); g.gain.exponentialRampToValueAtTime(.001, t + when + dur);
    s.connect(f).connect(g).connect(actx.destination); s.start(t + when); s.stop(t + when + dur + .02);
  };
  hit(0, .025, 4200, 1.2, .55);      // clic
  hit(.004, .04, 900, .9, .35);      // cuerpo
  hit(.06, .045, 2600, 1, .4);       // clac (se rearma)
  hit(.064, .05, 500, .8, .3);
}

const cv = $('#confetti'), ctx = cv.getContext('2d');
let parts = [], running = false; const dpr = Math.min(2, devicePixelRatio || 1);
function resize() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
resize(); addEventListener('resize', resize);
const COLORS = ['#e8458b', '#2fa36b', '#f2b134', '#2f8fd8', '#8e5bd0', '#e2725b'];
function burst(x, y, n = 80, spread = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (4 + Math.random() * 8) * spread;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, c: COLORS[i % COLORS.length], life: 1 });
  }
  if (!running) { running = true; requestAnimationFrame(loop); }
}
function loop() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  for (const p of parts) {
    p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  if (parts.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

const arc = (a, b, h) => `M${a.x} ${a.y - 40} C ${a.x + (b.x - a.x) * .25} ${h}, ${a.x + (b.x - a.x) * .75} ${h}, ${b.x} ${b.y - 40}`;

  const step = CONFIG.fotoMs, dur = 720, capH = 44, padX = 18;
  // caen en orden, desde arriba, y se van apilando en el centro de la mesa
  CONFIG.fotos.forEach((f, k) => {
    const im = fotoImgs[k], ar = (im.naturalWidth || 4) / (im.naturalHeight || 3);
    let iw = Math.min(W * .8, 360) - padX, ih = iw / ar;
    const maxH = H * .56; if (ih > maxH) { ih = maxH; iw = ih * ar; }
    const w = iw + padX, h = ih + capH + 9;
    const x = W / 2 + rnd(-.05, .05) * W, y = H * .5 + rnd(-.04, .04) * H;
    const r = rnd(-9, 9), spin = rnd(15, 45) * (Math.random() < .5 ? -1 : 1);
    const fromX = rnd(-.35, .35) * W, fromY = -(y + h * 1.2);       // fuera de la pantalla, por arriba
    const tilt = [rnd(-18, 18), rnd(-18, 18)];
    const el = document.createElement('div'); el.className = 'tphoto'; el.dataset.i = k;
    el.style.cssText = `width:${w}px;left:${x - w / 2}px;top:${y - h / 2}px;z-index:${k + 1}`;
    el.innerHTML = `<div class="im" style="height:${ih}px;background-image:url('${im.src}')"></div><div class="cap">${fotoCap(f)}</div>`;
    const T = (tx, ty, rz, rx, ry, sc) => `translate(${tx}px,${ty}px) rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg) scale(${sc})`;
    const kf = [
      // cae desde arriba, algo más grande (más cerca de la cámara) y girando
      { offset: 0,   opacity: 1, transform: T(fromX, fromY, r + spin, tilt[0], tilt[1], 1.3), boxShadow: '0 60px 50px rgba(0,0,0,.12)', easing: 'cubic-bezier(.45,.05,.8,.5)' },
      // golpea el montón
      { offset: .72, opacity: 1, transform: T(0, 0, r, 0, 0, .985), boxShadow: '0 2px 3px rgba(0,0,0,.45)', easing: 'ease-out' },
      // pequeño rebote y se asienta
      { offset: .86, opacity: 1, transform: T(rnd(-3, 3), -4, r + rnd(-1.5, 1.5), 0, 0, 1.008), boxShadow: '0 5px 8px rgba(0,0,0,.32)', easing: 'ease-in-out' },
      { offset: 1,   opacity: 1, transform: T(0, 0, r, 0, 0, 1), boxShadow: '0 3px 7px rgba(0,0,0,.35)' }
    ];
    dropTimers.push(setTimeout(() => {
      if (run !== dropRun) return;
      table.appendChild(el);
      el.animate(kf, { duration: dur, fill: 'forwards' });
      shutter();
    }, k * step));
  });
}
new IntersectionObserver(es => es.forEach(e => {
  if (e.intersectionRatio >= .6 && !table.dataset.on) { table.dataset.on = '1'; dropPhotos(); }
  else if (e.intersectionRatio === 0 && table.dataset.on) { delete table.dataset.on; clearTable(); }
}), { threshold: [0, .6] }).observe(table);
table.addEventListener('contextmenu', e => e.preventDefault());

const progress = $('#progress'), tlLine = $('.tl-line');
let ticking = false;
function onScroll() {
  ticking = false;
  progress.style.width = (scrollY / (document.documentElement.scrollHeight - innerHeight) * 100) + '%';
  const r = hist.getBoundingClientRect();
  if (r.bottom > -50 && r.top < innerHeight + 50) story(Math.min(1, Math.max(0, -r.top / (r.height - innerHeight))));

/* ================= DISCOTECA: bola de espejos, focos, reflejos y pista ================= */
const disco = (() => {
  const sec = $('#musica'), cv = document.createElement('canvas'); cv.className = 'disco-cv'; sec.prepend(cv);
  const g = cv.getContext('2d');
  let W = 0, H = 0, dp = 1, running = false, theta = 0, last = 0, turboUntil = 0;
  const t0 = performance.now();
  function size() { dp = Math.min(1.5, devicePixelRatio || 1); W = sec.clientWidth; H = sec.clientHeight; cv.width = W * dp; cv.height = H * dp; }
  const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
  const HEADS = [{ x: .04, ph: 0, sp: .9 }, { x: .3, ph: 1.7, sp: 1.25 }, { x: .7, ph: 3.1, sp: 1.05 }, { x: .96, ph: 4.4, sp: .8 }];
  const DOTS = Array.from({ length: 90 }, () => ({ lon: Math.random() * Math.PI * 2, y: Math.random(), s: 2 + Math.random() * 3.5, hue: Math.random() * 360, ph: Math.random() * 6 }));
  const BX = () => W / 2, BY = 112, R = 54;
  function frame(now) {
    if (!running) return;
    const t = (now - t0) / 1000, dt = Math.min(.05, last ? (now - last) / 1000 : 0); last = now;
    const turbo = now < turboUntil, bpm = turbo ? 150 : 118, beatF = t * bpm / 60, beatN = Math.floor(beatF), pulse = Math.exp(-(beatF % 1) * 5);
    theta += dt * (turbo ? 2.8 : .55);
    const bx = BX(), by = BY;
    g.setTransform(dp, 0, 0, dp, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#120d22'; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    // focos móviles: barren la sala y laten con el ritmo
    HEADS.forEach((h, i) => {
      const hue = (t * 35 + i * 90 + (turbo ? t * 260 : 0)) % 360;
      const ang = Math.PI / 2 + Math.sin(t * h.sp * (turbo ? 2.3 : 1) + h.ph) * .6;
      const len = Math.max(H, 900) * 1.1, spread = .075 + .025 * Math.sin(t * 2.7 + i);
      const x0 = h.x * W, inten = (.16 + .42 * pulse) * (.82 + Math.random() * .18);
      const gr = g.createLinearGradient(x0, 0, x0 + Math.cos(ang) * len, Math.sin(ang) * len);
      gr.addColorStop(0, `hsla(${hue},100%,62%,${inten})`); gr.addColorStop(.6, `hsla(${hue},100%,60%,${inten * .35})`); gr.addColorStop(1, `hsla(${hue},100%,60%,0)`);
      g.fillStyle = gr; g.beginPath(); g.moveTo(x0, 0);
      g.lineTo(x0 + Math.cos(ang - spread) * len, Math.sin(ang - spread) * len);
      g.lineTo(x0 + Math.cos(ang + spread) * len, Math.sin(ang + spread) * len); g.closePath(); g.fill();
      const sg = g.createRadialGradient(x0, 0, 0, x0, 0, 46);
      sg.addColorStop(0, `hsla(${hue},100%,85%,${.35 + .5 * pulse})`); sg.addColorStop(1, 'hsla(0,0%,0%,0)');
      g.fillStyle = sg; g.fillRect(x0 - 46, -46, 92, 92);
    });
    // reflejos de la bola que recorren las paredes al girar
    DOTS.forEach(d => {
      const a = d.lon + theta, c = Math.cos(a); if (c < .05) return;
      const x = bx + Math.sin(a) * W * .8, y = 30 + d.y * (H - 60);
      const al = c * (.3 + .3 * Math.sin(t * 7 + d.ph)) * (turbo ? 1.4 : 1), r = d.s * 2.4;
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `hsla(${d.hue},90%,88%,${al})`); rg.addColorStop(1, 'hsla(0,0%,0%,0)');
      g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
    });
    // pista de baile en perspectiva
    const fh = Math.min(190, H * .16), fy = H - fh, cols = 7, rows = 5;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const v0 = Math.pow(r / rows, 1.35), v1 = Math.pow((r + 1) / rows, 1.35);
      const w0 = W * (.6 + .5 * v0), w1 = W * (.6 + .5 * v1), y0 = fy + fh * v0 + 1, y1 = fy + fh * v1 - 1;
      const xa = bx - w0 / 2 + w0 * c / cols + 1, xb = bx - w0 / 2 + w0 * (c + 1) / cols - 1;
      const xd = bx - w1 / 2 + w1 * c / cols + 1, xc = bx - w1 / 2 + w1 * (c + 1) / cols - 1;
      const on = hash(c + r * 7, beatN) > .45, hue = hash(c * 3 + r, beatN) * 360;
      g.fillStyle = `hsla(${hue},100%,55%,${on ? .3 + .45 * pulse : .05})`;
      g.beginPath(); g.moveTo(xa, y0); g.lineTo(xb, y0); g.lineTo(xc, y1); g.lineTo(xd, y1); g.closePath(); g.fill();
    }
    // la bola de espejos
    g.globalCompositeOperation = 'source-over';
    g.strokeStyle = '#8a8a9a'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(bx, 0); g.lineTo(bx, by - R); g.stroke();
    const base = g.createRadialGradient(bx - R * .3, by - R * .3, R * .1, bx, by, R);
    base.addColorStop(0, '#5a5a66'); base.addColorStop(1, '#0c0c12');
    g.fillStyle = base; g.beginPath(); g.arc(bx, by, R, 0, Math.PI * 2); g.fill();
    const STEP = Math.PI / 15, sparks = [];
    for (let la = -Math.PI / 2 + STEP * .5, li = 0; la < Math.PI / 2 - .01; la += STEP, li++) {
      const n = Math.max(6, Math.round(30 * Math.cos(la))), dl = Math.PI * 2 / n;
      for (let k = 0; k < n; k++) {
        const lo = k * dl + theta, mid = lo + dl * .45, zc = Math.cos(la + STEP * .45) * Math.cos(mid);
        if (zc <= .03) continue;
        const P = (A, B) => [bx + R * Math.cos(A) * Math.sin(B), by - R * Math.sin(A)];
        const p1 = P(la, lo), p2 = P(la, lo + dl * .88), p3 = P(la + STEP * .88, lo + dl * .88), p4 = P(la + STEP * .88, lo);
        const nx = Math.cos(la) * Math.sin(mid), ny = Math.sin(la);
        const lit = Math.max(0, -.45 * nx + .55 * ny + .7 * zc);
        const sp = hash(li, k), tw = Math.pow(Math.max(0, Math.sin(t * (turbo ? 9 : 3) + sp * 50 + mid * 3)), 14);
        const hue = (t * 50 + sp * 360) % 360;
        g.fillStyle = tw > .35 ? `hsl(${hue},85%,${62 + 30 * tw}%)` : `hsl(225,12%,${Math.min(92, 14 + 62 * lit + 18 * sp)}%)`;
        g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.lineTo(p3[0], p3[1]); g.lineTo(p4[0], p4[1]); g.closePath(); g.fill();
        if (tw > .85) sparks.push([(p1[0] + p3[0]) / 2, (p1[1] + p3[1]) / 2, hue]);
      }
    }
    g.globalCompositeOperation = 'lighter';
    const halo = g.createRadialGradient(bx, by, R * .8, bx, by, R * 2.2);
    halo.addColorStop(0, `hsla(${(t * 40) % 360},100%,75%,${.18 + .2 * pulse})`); halo.addColorStop(1, 'hsla(0,0%,0%,0)');
    g.fillStyle = halo; g.fillRect(bx - R * 2.2, by - R * 2.2, R * 4.4, R * 4.4);
    sparks.slice(0, 6).forEach(([x, y, hue]) => {           // destellos en forma de estrella
      g.strokeStyle = `hsla(${hue},100%,90%,.9)`; g.lineWidth = 1.2; const s = 9 + Math.random() * 6;
      g.beginPath(); g.moveTo(x - s, y); g.lineTo(x + s, y); g.moveTo(x, y - s); g.lineTo(x, y + s); g.stroke();
    });
    if (turbo && pulse > .8) { g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(0, 0, W, H); }   // estroboscopio
    requestAnimationFrame(frame);
  }
  function start() { if (running) return; size(); running = true; last = 0; requestAnimationFrame(frame); }
  function stop() { running = false; }
  new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? start() : stop()), { rootMargin: '100px' }).observe(sec);
  if (window.ResizeObserver) new ResizeObserver(() => { if (running) size(); }).observe(sec);
  function turbo(ms = 3000) {
    turboUntil = performance.now() + ms;
    [0, .2, .4, .6, .8, 1, 1.2, 1.4].forEach((w, i) => tone(i % 2 ? 180 : 60, .16, i % 2 ? 'square' : 'sine', i % 2 ? .05 : .35, w));
  }
  sec.addEventListener('pointerdown', e => {
    const r = sec.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (Math.hypot(x - BX(), y - BY) < R * 1.4) { turbo(3500); burst(e.clientX, e.clientY, 50, .7); }
  });
  return { turbo };
})();

/* ================= CONFIRMACIÓN ================= */
const no = $('#no'), yes = $('#yes'), zone = $('#zone'), noMsg = $('#noMsg'), rform = $('#rsvpForm');
let tries = 0, tired = false, rsvpState = null;
function runAway(e) {
  if (tired) return;
  if (e && e.cancelable) e.preventDefault();
  no.style.left = Math.random() * (zone.clientWidth - no.offsetWidth) + 'px';
  no.style.top = Math.random() * (zone.clientHeight - no.offsetHeight) + 'px';
  noMsg.textContent = L().excuses[tries]; tone(300 + tries * 60, .12, 'square', .05);
  if (++tries >= L().excuses.length) { tired = true; setTimeout(() => { no.textContent = L().noFinal; noMsg.textContent = L().noLast; }, 600); }
}
no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') runAway(e); });
no.addEventListener('touchstart', runAway, { passive: false });
no.addEventListener('click', e => { if (tired) answer('no'); else runAway(e); });
yes.addEventListener('click', () => answer('yes'));
function answer(a) {
  rsvpState = a; zone.hidden = true; noMsg.textContent = '';
  showForm(a);
  if (a === 'yes') { chime(); for (let i = 0; i < 4; i++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * (.3 + Math.random() * .4), 90), i * 250); }
  else sad();
}
function showForm(a) {
  rform.hidden = false;
  $('#rsvpTitle').textContent = a === 'yes' ? L().yesTitle : L().noTitle;
  $$('.onlyYes').forEach(el => el.hidden = a !== 'yes');
}
$$('.step').forEach(st => st.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const o = st.querySelector('output'); o.textContent = Math.max(0, Math.min(20, +o.textContent + +b.dataset.d)); tone(600, .06, 'triangle', .08);
}));
$('#changeAns').addEventListener('click', () => {
  rsvpState = null; rform.hidden = true; $('#doneBox').hidden = true; zone.hidden = false;
  tries = 0; tired = false; no.textContent = L().no; no.style.left = ''; no.style.top = '';
});
rform.addEventListener('submit', e => {
  e.preventDefault();
  const d = { nombre: rform.nombre.value.trim(), intol: rform.intol.value.trim(), coment: rform.coment.value.trim() };
  if (!d.nombre) return;
  $$('.step').forEach(st => d[st.dataset.name] = st.querySelector('output').textContent);
  const isYes = rsvpState === 'yes';
  window.open(`https://wa.me/${CONFIG.telefono}?text=` + encodeURIComponent(L().wa(isYes, d)), '_blank');
  rform.hidden = true; $('#doneBox').hidden = false;
  $('#doneTitle').textContent = isYes ? L().doneYesT : L().doneNoT;
  $('#doneText').textContent = isYes ? L().doneYes : L().doneNo;
  $('#gcal').hidden = !isYes;
});
function gcalUrl() {
  const z = d => d.toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const end = new Date(fecha.getTime() + 8 * 3600e3);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=Europe/Madrid' +
    '&text=' + encodeURIComponent(L().calText) + '&dates=' + z(fecha) + '/' + z(end) +
    '&location=' + encodeURIComponent(CONFIG.lugar.nombre + ', ' + CONFIG.lugar.direccion) + '&details=' + encodeURIComponent(L().calDetails);
}

setLang(lang);
story(0); onScroll();
